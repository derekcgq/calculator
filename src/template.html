<body>
<div class="wrap">
<header><h1 data-i18n="title"></h1><p data-i18n="sub"></p><div class="lang"><button data-l="en">English</button><button data-l="zh">中文</button></div></header>
<form class="card" onsubmit="return false">
 <div class="grid">
  <label><span data-i18n="name"></span><input id="pname" placeholder="e.g. Alex"></label>
  <label><span data-i18n="bdate"></span><input type="date" id="bdate" required></label>
